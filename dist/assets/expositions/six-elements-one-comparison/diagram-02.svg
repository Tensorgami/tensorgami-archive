<svg role="img" aria-labelledby="companion-diagram-title-02 companion-diagram-desc-02" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" version="1.1" width="85.013" height="52.119" viewBox="0 0 85.013 52.119"><title id="companion-diagram-title-02">A homomorphism commutes with the appropriate translations</title><desc id="companion-diagram-desc-02">A commutative square with G at all four corners. The top map is translation tau_c, both downward maps are h, and the bottom map is translation tau_{h(c)}. Thus h composed with tau_c equals tau_{h(c)} composed with h. In this example h(x) = 2x.</desc>
